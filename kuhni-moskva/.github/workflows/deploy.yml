name: Deploy HTML site to Yandex Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload to Yandex Cloud
        uses: osism/yandex-cloud-storage-sync@v1
        with:
          access-key-id: ${{ secrets.YC_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.YC_BUCKET }}
          local-path: ./
          delete-removed: true
